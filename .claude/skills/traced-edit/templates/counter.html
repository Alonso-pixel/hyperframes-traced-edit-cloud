<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <!-- Odometer counter that goes up by one on every event of the timeline. Generalized from
         pintas-presupuesto/compositions/counter.html. deliver injects the CFG object:
         { duration, events: [cut seconds], fast: {start, end, label} | null, label, accent: [r,g,b] } -->
    <template>
      <style>
        @font-face {
          font-family: "Figtree";
          src: url("assets/fonts/figtree-latin.woff2") format("woff2");
          font-weight: 300 900;
          unicode-range: U+0000-00FF;
        }
        @font-face {
          font-family: "Figtree";
          src: url("assets/fonts/figtree-latin-ext.woff2") format("woff2");
          font-weight: 300 900;
          unicode-range: U+0100-024F, U+1E00-1EFF;
        }
        #counter-root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          font-family: "Figtree", sans-serif;
          color: #fdfdfd;
        }
        #ctr-scrim {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
          height: 900px;
          background: linear-gradient(to top, rgba(0, 0, 0, 0.68) 0%, rgba(0, 0, 0, 0.52) 40%, rgba(0, 0, 0, 0) 100%);
          opacity: 0;
        }
        #ctr-box {
          position: absolute;
          left: 86px;
          bottom: 360px;
          width: 620px;
          opacity: 0;
        }
        #ctr-head {
          display: flex;
          align-items: center;
          gap: 18px;
          height: 40px;
        }
        #ctr-label {
          font-size: 34px;
          font-weight: 700;
          line-height: 1;
          color: rgba(253, 253, 253, 0.72);
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
        }
        #ctr-ff {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 30px;
          font-weight: 700;
          line-height: 1;
          opacity: 0;
        }
        #ctr-ff svg {
          display: block;
          width: 34px;
          height: 22px;
        }
        #ctr-num {
          display: flex;
          height: 160px;
          margin-top: 6px;
          font-size: 160px;
          font-weight: 800;
          line-height: 1;
          font-variant-numeric: tabular-nums;
          color: #fdfdfd;
          text-shadow: 0 2px 12px rgba(0, 0, 0, 0.6);
          transform-origin: 0% 100%;
        }
        .ctr-col {
          position: relative;
          width: 0.68em;
          height: 1em;
          overflow: hidden;
        }
        #ctr-tens {
          opacity: 0.28;
        }
        .ctr-strip {
          display: flex;
          flex-direction: column;
        }
        .ctr-strip span {
          display: block;
          height: 1em;
          text-align: center;
        }
        #ctr-rail {
          display: flex;
          flex-wrap: wrap;
          gap: 4px;
          margin-top: 22px;
        }
        .ctr-seg {
          position: relative;
          width: 14px;
          height: 12px;
          background: rgba(253, 253, 253, 0.18);
        }
        .ctr-fill {
          position: absolute;
          inset: 0;
          transform-origin: 50% 100%;
        }
        /* deliver.json overlay.css is appended here (Studio edits get ported to it) */
        /* __EXTRA_CSS__ */
      </style>

      <div id="counter-root" data-composition-id="counter" data-width="1080" data-height="1920" data-duration="__DURATION__">
        <div id="ctr-scrim"></div>
        <div id="ctr-box">
          <div id="ctr-head">
            <div id="ctr-label"></div>
            <div id="ctr-ff">
              <svg viewBox="0 0 34 22" aria-hidden="true"><path id="ctr-ff-icon" d="M0 0 L16 11 L0 22 Z M17 0 L33 11 L17 22 Z" /></svg>
              <span id="ctr-ff-label"></span>
            </div>
          </div>
          <div id="ctr-num">
            <div class="ctr-col" id="ctr-tens"><div class="ctr-strip" id="ctr-tens-strip" data-layout-allow-overflow data-layout-allow-occlusion></div></div>
            <div class="ctr-col" id="ctr-units"><div class="ctr-strip" id="ctr-units-strip" data-layout-allow-overflow data-layout-allow-occlusion></div></div>
          </div>
          <div id="ctr-rail"></div>
        </div>
      </div>

      <script>
        (function () {
          // Injected by traced-edit deliver from states/4video-edition(human-review)/out/timeline.json.
          var CFG = __CONFIG__;
          var TICKS = CFG.events;
          var rgb = CFG.accent.join(",");
          var G = "rgb(" + rgb + ")", W = "rgba(253,253,253,0.92)";
          var GLOW = "0 0 30px rgba(" + rgb + ",0.85), 0 2px 12px rgba(0,0,0,0.6)";
          var NOGLOW = "0 0 0px rgba(" + rgb + ",0), 0 2px 12px rgba(0,0,0,0.6)";
          var SEGGLOW = "0 0 14px rgba(" + rgb + ",0.9)";
          var N = TICKS.length;
          var CELL = 100 / 11; // strips hold 0-9 plus a trailing 0, so 9 -> 0 keeps rolling up

          document.getElementById("ctr-label").textContent = CFG.label;
          document.getElementById("ctr-ff").style.color = G;
          document.getElementById("ctr-ff-icon").setAttribute("fill", G);
          document.getElementById("ctr-ff-label").textContent = CFG.fast ? CFG.fast.label : "";

          ["ctr-tens-strip", "ctr-units-strip"].forEach(function (id) {
            var strip = document.getElementById(id);
            for (var d = 0; d <= 10; d++) {
              var s = document.createElement("span");
              s.textContent = String(d % 10);
              s.setAttribute("data-layout-allow-overflow", "");
              s.setAttribute("data-layout-allow-occlusion", "");
              s.setAttribute("data-layout-allow-overlap", "");
              strip.appendChild(s);
            }
          });
          var rail = document.getElementById("ctr-rail");
          var fills = [];
          for (var i = 0; i < N; i++) {
            var seg = document.createElement("div");
            seg.className = "ctr-seg";
            var fill = document.createElement("div");
            fill.className = "ctr-fill";
            fill.style.background = G;
            fill.style.boxShadow = SEGGLOW;
            seg.appendChild(fill);
            rail.appendChild(seg);
            fills.push(fill);
          }

          var tl = gsap.timeline({ paused: true });
          tl.set(["#ctr-tens-strip", "#ctr-units-strip"], { yPercent: 0 }, 0);
          tl.set(fills, { scaleY: 0 }, 0);
          if (!N) {
            window.__timelines["counter"] = tl;
            return;
          }

          var IN = Math.max(0, TICKS[0] - 0.55);
          tl.fromTo("#ctr-scrim", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, Math.max(0, IN - 0.1));
          tl.fromTo("#ctr-box", { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, IN);
          tl.fromTo(".ctr-seg", { opacity: 0, scaleY: 0.2 }, { opacity: 1, scaleY: 1, duration: 0.18, ease: "power2.out", stagger: 0.008 }, IN + 0.05);

          if (CFG.fast) {
            tl.fromTo("#ctr-ff", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, CFG.fast.start);
            tl.to("#ctr-ff", { opacity: 0, duration: 0.25, ease: "power2.in" }, CFG.fast.end - 0.25);
          }

          // Per-tick motion is set + to (never fromTo) so seeking backwards restores the prior state.
          function roll(strip, from, to, at) {
            var target = to === 0 && from === 9 ? 10 : to;
            tl.to(strip, { yPercent: -target * CELL, duration: 0.42, ease: "back.out(1.4)" }, at);
            tl.set(strip, { filter: "blur(5px)" }, at);
            tl.to(strip, { filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, at);
            if (target === 10) tl.set(strip, { yPercent: 0 }, at + 0.5);
          }

          TICKS.forEach(function (t, i) {
            var n = i + 1, prev = n - 1;
            var last = n === N;
            if (prev % 10 !== n % 10) roll("#ctr-units-strip", prev % 10, n % 10, t);
            if (Math.floor(prev / 10) !== Math.floor(n / 10)) {
              roll("#ctr-tens-strip", Math.floor(prev / 10), Math.floor(n / 10), t);
              if (n === 10) tl.to("#ctr-tens", { opacity: 1, duration: 0.3, ease: "power2.out" }, t);
            }
            tl.to("#ctr-num", { scale: last ? 1.14 : 1.06, duration: 0.1, ease: "power2.out" }, t);
            tl.to("#ctr-num", { scale: 1, duration: last ? 0.5 : 0.32, ease: "back.out(1.4)" }, t + 0.1);
            tl.set("#ctr-num", { color: G, textShadow: GLOW }, t);
            if (!last) tl.to("#ctr-num", { color: "#fdfdfd", textShadow: NOGLOW, duration: 0.6, ease: "power2.out" }, t);
            tl.to(fills[i], { scaleY: 1, duration: 0.32, ease: "back.out(2)" }, t);
            if (i > 0) tl.to(fills[i - 1], { backgroundColor: W, boxShadow: "0 0 0px rgba(" + rgb + ",0)", duration: 0.35, ease: "power2.out" }, t);
            if (last) tl.to(fills.slice(0, N - 1), { backgroundColor: G, boxShadow: SEGGLOW, duration: 0.2, ease: "power2.out", stagger: 0.02 }, t + 0.4);
          });

          window.__timelines["counter"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
